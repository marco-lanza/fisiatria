<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fisiatria</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS — ULTRA-MINIMAL MONOCHROME
       ========================================================================== */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 9999px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --transition: 180ms var(--ease-out);

      /* Colori semantici usati SOLO per validazione risposte, statistiche e flag */
      --color-correct: #10b981;
      --color-correct-bg: rgba(16, 185, 129, 0.13);
      --color-wrong: #ef4444;
      --color-wrong-bg: rgba(239, 68, 68, 0.13);
      --color-flag: #f59e0b;
      --color-flag-bg: rgba(245, 158, 11, 0.15);
    }

    html[data-theme="dark"] {
      --bg-page: #000000;
      --bg-surface: #0c0c0f;
      --bg-elevated: #16161b;
      --bg-hover: #1e1e26;
      --border: #24242c;
      --border-strong: #363642;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-muted: #52525b;
      --accent-bg: #ffffff;
      --accent-fg: #000000;
      --chart-fill: rgba(255, 255, 255, 0.08);
      --chart-grid: rgba(255, 255, 255, 0.06);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    html[data-theme="light"] {
      --bg-page: #d8dce3;
      --bg-surface: #ffffff;
      --bg-elevated: #eff1f5;
      --bg-hover: #e4e7ee;
      --border: #c2c7d0;
      --border-strong: #99a1af;
      --text-primary: #000000;
      --text-secondary: #525866;
      --text-muted: #767d8c;
      --accent-bg: #000000;
      --accent-fg: #ffffff;
      --chart-fill: rgba(0, 0, 0, 0.08);
      --chart-grid: rgba(0, 0, 0, 0.07);
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    /* ==========================================================================
       2. BASE & RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100dvh;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color var(--transition), color var(--transition);
      overflow-x: hidden;
      outline: none;
    }

    button, input {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }

    button {
      cursor: pointer;
      user-select: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .app-container {
      width: 100%;
      max-width: 1060px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 640px) {
      .app-container {
        padding: 16px 14px 88px;
      }
    }

    .view {
      display: none;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      animation: fadeIn 180ms var(--ease-out);
    }

    .view.active {
      display: flex;
    }

    /* La vista HOME riempie verticalmente la finestra senza spazio vuoto */
    #view-home.active {
      flex: 1;
      min-height: calc(100dvh - 48px);
      justify-content: space-between;
      gap: 20px;
    }

    @media (max-width: 640px) {
      #view-home.active {
        min-height: calc(100dvh - 32px);
      }
    }

    /* Vista QUIZ e RECAP larghe quanto la HOME (scrollabili verticalmente) */
    #view-quiz,
    #view-recap {
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
    }

    @media (min-width: 1024px) and (max-width: 1220px) {
      #view-quiz {
        padding-right: 76px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       3. COMPONENTI MINIMALI CONDIVISI
       ========================================================================== */
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
      box-shadow: var(--card-shadow);
    }

    .icon-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.confirm-danger {
      background: var(--color-wrong-bg);
      border-color: var(--color-wrong);
      color: var(--color-wrong);
    }

    .icon-btn.flagged {
      background: var(--color-flag-bg);
      border-color: var(--color-flag);
      color: var(--color-flag);
    }

    .surface-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--card-shadow);
    }

    /* ==========================================================================
       4. VISTA HOME (OTTIMIZZATA VERTICALMENTE E ORIZZONTALMENTE)
       ========================================================================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 4-Stat Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }

    .stat-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--card-shadow);
    }

    .stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
    }

    .stat-val {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .stat-lbl {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    /* Grafico centrale espanso verticalmente */
    .chart-card {
      flex: 1;
      min-height: 260px;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chart-svg-wrap {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 220px;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    /* Barra di controllo inferiore */
    .controls-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 20px;
    }

    .stepper-pill {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px;
      gap: 4px;
    }

    .stepper-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.2rem;
      font-weight: 600;
      transition: all var(--transition);
    }

    .stepper-btn:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .stepper-btn:active {
      transform: scale(0.92);
    }

    .count-input {
      width: 64px;
      height: 40px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .launch-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
    }

    @media (max-width: 560px) {
      .controls-card {
        flex-direction: column;
        align-items: stretch;
      }
      .stepper-pill {
        justify-content: space-between;
      }
      .count-input {
        flex: 1;
      }
      .launch-actions {
        width: 100%;
      }
      .launch-actions > button {
        flex: 1;
      }
    }

    .btn-pill {
      height: 48px;
      padding: 0 26px;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn-pill:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent-bg);
      color: var(--accent-fg);
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.88;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .badge-count {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    /* ==========================================================================
       5. VISTA QUIZ & FRECCIA LATERALE ALL'ALTEZZA DELLA DOMANDA
       ========================================================================== */
    .quiz-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quiz-nav-left,
    .quiz-nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-counter {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .seen-pill {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--card-shadow);
    }

    .progress-line-track {
      width: 100%;
      height: 3px;
      background: var(--border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-line-fill {
      height: 100%;
      width: 0%;
      background: var(--text-primary);
      transition: width 240ms var(--ease-out);
    }

    /* Wrapper della domanda per ancorare la freccia esattamente alla sua altezza su desktop */
    .question-box-wrapper {
      position: relative;
      width: 100%;
    }

    .question-box {
      padding: 24px 26px;
    }

    .question-text {
      font-size: 1.14rem;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.01em;
    }

    /* Pulsante Freccia "Domanda Successiva" (#next-btn) — Zero Layout Shift */
    .next-arrow-btn {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-pill);
      background: var(--accent-bg);
      color: var(--accent-fg);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }

    /* Desktop / Layout Orizzontale: a destra all'altezza esatta del testo della domanda */
    @media (min-width: 1024px) {
      .next-arrow-btn {
        position: absolute;
        left: calc(100% + 22px);
        top: 50%;
        transform: translateY(-50%) scale(0.9);
      }
      .next-arrow-btn.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) scale(1);
      }
      .next-arrow-btn:hover {
        opacity: 0.9;
      }
      .next-arrow-btn:active {
        transform: translateY(-50%) scale(0.93);
      }
    }

    /* Mobile / Layout Verticale: fisso in basso a destra */
    @media (max-width: 1023px) {
      .next-arrow-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        transform: translateY(10px) scale(0.9);
      }
      .next-arrow-btn.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .next-arrow-btn:active {
        transform: translateY(0) scale(0.93);
      }
    }

    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-row {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      text-align: left;
      box-shadow: var(--card-shadow);
      transition: background-color var(--transition), border-color var(--transition), opacity var(--transition);
    }

    .option-row:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .option-row:active:not(:disabled) {
      transform: scale(0.995);
    }

    .option-row:disabled {
      cursor: default;
    }

    .option-letter {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-top: 1px;
      transition: all var(--transition);
    }

    .option-label {
      flex: 1;
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text-primary);
    }

    /* Stati validazione risposta */
    .option-row.correct {
      background: var(--color-correct-bg);
      border-color: var(--color-correct);
    }

    .option-row.correct .option-letter {
      background: var(--color-correct);
      border-color: var(--color-correct);
      color: #000000;
    }

    .option-row.wrong {
      background: var(--color-wrong-bg);
      border-color: var(--color-wrong);
    }

    .option-row.wrong .option-letter {
      background: var(--color-wrong);
      border-color: var(--color-wrong);
      color: #ffffff;
    }

    .option-row.dimmed {
      opacity: 0.42;
    }

    /* Spiegazione sotto le opzioni (senza spostare le opzioni sopra) */
    .explanation-panel {
      display: none;
      padding: 18px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.6;
      animation: fadeIn 180ms var(--ease-out);
    }

    .explanation-panel.visible {
      display: block;
    }

    /* ==========================================================================
       6. VISTA RECAP
       ========================================================================== */
    .recap-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 24px;
    }

    .recap-metrics {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .recap-pct {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .recap-submetrics {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .recap-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mistakes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mistake-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mistake-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .mistake-q {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .mistake-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
    }

    .mistake-opt {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }

    .mistake-opt.wrong {
      background: var(--color-wrong-bg);
      color: var(--color-wrong);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .mistake-opt.correct {
      background: var(--color-correct-bg);
      color: var(--color-correct);
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .mistake-exp {
      font-size: 0.86rem;
      color: var(--text-secondary);
      line-height: 1.55;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body tabindex="-1" autofocus>
  <div class="app-container">

    <!-- ======================================================================
         1. HOME VIEW
         ====================================================================== -->
    <main id="view-home" class="view active">
      <header class="top-bar">
        <h1 class="app-title">🦴 Medicina Fisica & Riabilitativa - Fisiatria</h1>
        <div class="top-actions">
          <button type="button" id="btn-reset" class="icon-btn" title="Reset statistiche" aria-label="Reset statistiche">
            <svg id="icon-reset" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
          </button>
          <button type="button" id="btn-theme" class="icon-btn" title="Cambia tema" aria-label="Cambia tema">
            <span id="theme-icon-slot" style="display:inline-flex;"></span>
          </button>
        </div>
      </header>

      <!-- 4 Statistiche -->
      <section class="stats-grid" aria-label="Statistiche">
        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-lbl">Totale</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          </div>
          <span class="stat-val" id="stat-total">0</span>
        </div>
        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-lbl">Nuove</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </div>
          <span class="stat-val" id="stat-unseen">0</span>
        </div>
        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-lbl">Ripasso</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </div>
          <span class="stat-val" id="stat-review">0</span>
        </div>
        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-lbl">Media</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <span class="stat-val" id="stat-avg">—</span>
        </div>
      </section>

        answered: false,
        correct: 0,
        mistakes: [],
        startTime: 0
      }
    };

    // ==========================================================================
    // PERSISTENZA
    // ==========================================================================
    function loadState() {
      try {
        const t = localStorage.getItem(STORAGE_KEYS.THEME);
        if (t === "light" || t === "dark") STATE.theme = t;

        const s = localStorage.getItem(STORAGE_KEYS.STATS);
        if (s) STATE.stats = JSON.parse(s) || {};

        const h = localStorage.getItem(STORAGE_KEYS.HISTORY);
        if (h) STATE.history = (JSON.parse(h) || []).slice(-10);

        const c = localStorage.getItem(STORAGE_KEYS.COUNT);
        if (c) {
          const n = parseInt(c, 10);
          if (!isNaN(n) && n >= 1) {
            document.getElementById("q-count-input").value = n;
          }
        }
      } catch (e) {}
    }

    function saveStats() {
      try {
        localStorage.setItem(STORAGE_KEYS.STATS, JSON.stringify(STATE.stats));
      } catch (e) {}
    }

    function saveHistory() {
      try {
        localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(STATE.history.slice(-10)));
      } catch (e) {}
    }

    function getQStat(id) {
      if (!STATE.stats[id]) {
        STATE.stats[id] = { timesSeen: 0, isWrong: false, isFlagged: false };
      }
      return STATE.stats[id];
    }

    // ==========================================================================
    // TEMA
    // ==========================================================================
    function applyTheme(theme) {
      STATE.theme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      try {
        localStorage.setItem(STORAGE_KEYS.THEME, theme);
      } catch (e) {}

      const slot = document.getElementById("theme-icon-slot");
      if (theme === "dark") {
        slot.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
      } else {
        slot.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      }
    }

    // ==========================================================================
    // SELEZIONE E SHUFFLE
    // ==========================================================================
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function cleanOptionText(raw) {
      return String(raw).replace(/^[A-E][\)\.\-\:]\s*/i, "").trim();
    }

    function getReviewQuestions() {
      return QUIZ_DATA.filter((q) => {
        const s = getQStat(q.id);
        return s.isWrong || s.isFlagged;
      });
    }

    function selectStandardQuestions(requested) {
      const count = Math.min(Math.max(1, requested), QUIZ_DATA.length);
      const unseen = [];
      const seenBuckets = new Map();

      for (const q of QUIZ_DATA) {
        const t = getQStat(q.id).timesSeen || 0;
        if (t === 0) {
          unseen.push(q);
        } else {
          if (!seenBuckets.has(t)) seenBuckets.set(t, []);
          seenBuckets.get(t).push(q);
        }
      }

      const shuffledUnseen = shuffle(unseen);
      if (shuffledUnseen.length >= count) {
        return shuffledUnseen.slice(0, count);
      }

      const result = [...shuffledUnseen];
      let needed = count - result.length;

      const sortedKeys = Array.from(seenBuckets.keys()).sort((a, b) => a - b);
      for (const k of sortedKeys) {
        if (needed <= 0) break;
        const chunk = shuffle(seenBuckets.get(k)).slice(0, needed);
        result.push(...chunk);
        needed -= chunk.length;
      }

      return shuffle(result);
    }

    // ==========================================================================
    // CAMBIO VISTA
    // ==========================================================================
    function setView(view) {
      STATE.view = view;
      document.getElementById("view-home").classList.toggle("active", view === "HOME");
      document.getElementById("view-quiz").classList.toggle("active", view === "QUIZ");
      document.getElementById("view-recap").classList.toggle("active", view === "RECAP");

      if (view !== "QUIZ") {
        document.getElementById("next-btn").classList.remove("visible");
      }

      window.scrollTo({ top: 0, behavior: "instant" });

      if (view === "HOME") renderHome();
    }

    // ==========================================================================
    // HOME VIEW & CHART
    // ==========================================================================
    function renderHome() {
      const total = QUIZ_DATA.length;
      let unseen = 0;
      let review = 0;

      for (const q of QUIZ_DATA) {
        const s = getQStat(q.id);
        if ((s.timesSeen || 0) === 0) unseen++;
        if (s.isWrong || s.isFlagged) review++;
      }

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-unseen").textContent = unseen;
      document.getElementById("stat-review").textContent = review;

      if (STATE.history.length === 0) {
        document.getElementById("stat-avg").textContent = "—";
      } else {
        const avg = Math.round(
          STATE.history.reduce((acc, item) => acc + item.scorePct, 0) / STATE.history.length
        );
        document.getElementById("stat-avg").textContent = `${avg}%`;
      }

      const btnReview = document.getElementById("btn-start-review");
      document.getElementById("review-badge-home").textContent = review;
      btnReview.disabled = review === 0;

      renderChart();
    }

    function renderChart() {
      const slot = document.getElementById("chart-slot");
      const hist = STATE.history.slice(-10);
      const rect = slot.getBoundingClientRect();
      const w = Math.max(640, Math.round(rect.width) || 960);
      const h = Math.max(220, Math.round(rect.height) || 260);
      const padX = 32;
      const padY = 28;
      const innerW = w - padX * 2;
      const innerH = h - padY * 2;

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
        const y = (padY + ratio * innerH).toFixed(1);
        return `<line x1="${padX}" y1="${y}" x2="${w - padX}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`;
      }).join("");

      if (hist.length === 0) {
        slot.innerHTML = `
          <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
            ${gridLines}
            <line x1="${padX}" y1="${h / 2}" x2="${w - padX}" y2="${h / 2}" stroke="var(--border-strong)" stroke-dasharray="5 5" stroke-width="1.5"/>
          </svg>
        `;
        return;
      }

      const pts = hist.map((item, i) => {
        const x = hist.length === 1 ? w / 2 : padX + (i / (hist.length - 1)) * innerW;
        const pct = Math.max(0, Math.min(100, item.scorePct));
        const y = padY + innerH - (pct / 100) * innerH;
        return { x, y, pct: Math.round(pct) };
      });

      let linePath = "";
      let areaPath = "";
      const baseY = padY + innerH;

      if (pts.length === 1) {
        linePath = `M ${padX} ${pts[0].y} L ${w - padX} ${pts[0].y}`;
        areaPath = `M ${padX} ${pts[0].y} L ${w - padX} ${pts[0].y} L ${w - padX} ${baseY} L ${padX} ${baseY} Z`;
      } else {
        linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
        areaPath = `${linePath} L ${pts[pts.length - 1].x.toFixed(1)} ${baseY} L ${pts[0].x.toFixed(1)} ${baseY} Z`;
      }

      const dots = pts.map((p) => `
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="var(--bg-surface)" stroke="var(--text-primary)" stroke-width="2.5" />
        <text x="${p.x.toFixed(1)}" y="${(p.y - 12).toFixed(1)}" text-anchor="middle" fill="var(--text-secondary)" font-size="12" font-family="var(--font-mono)" font-weight="600">${p.pct}%</text>
      `).join("");

      slot.innerHTML = `
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none">
          ${gridLines}
          <path d="${areaPath}" fill="var(--chart-fill)" />
          <path d="${linePath}" fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          ${dots}
        </svg>
      `;
    }

    // ==========================================================================
    // QUIZ SESSION
    // ==========================================================================
    function getRequestedCount() {
      const el = document.getElementById("q-count-input");
      const v = parseInt(el.value, 10);
      return isNaN(v) || v < 1 ? 1 : v;
    }

    function startStandardSession() {
      if (!QUIZ_DATA.length) return;
      const count = getRequestedCount();
      try {
        localStorage.setItem(STORAGE_KEYS.COUNT, String(count));
      } catch (e) {}
      beginSession(selectStandardQuestions(count));
    }

    function startReviewSession() {
      const pool = getReviewQuestions();
      if (!pool.length) return;
      beginSession(shuffle(pool));
    }

    function beginSession(questions) {
      STATE.session = {
        questions,
        index: 0,
        answered: false,
        correct: 0,
        mistakes: [],
        startTime: Date.now()
      };
      setView("QUIZ");
      renderQuestion();
    }

    function renderQuestion() {
      const s = STATE.session;
      const q = s.questions[s.index];
      if (!q) return;

      s.answered = false;
      const stat = getQStat(q.id);

      document.getElementById("quiz-counter").textContent = `${s.index + 1} / ${s.questions.length}`;
      document.getElementById("quiz-seen-count").textContent = stat.timesSeen || 0;
      document.getElementById("quiz-progress-bar").style.width = `${(s.index / s.questions.length) * 100}%`;
      document.getElementById("btn-quiz-flag").classList.toggle("flagged", Boolean(stat.isFlagged));

      document.getElementById("quiz-question").textContent = q.question;

      const optsContainer = document.getElementById("quiz-options");
      optsContainer.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-row";

        const letterSpan = document.createElement("span");
        letterSpan.className = "option-letter";
        letterSpan.textContent = LETTERS[idx] || String(idx + 1);

        const labelSpan = document.createElement("span");
        labelSpan.className = "option-label";
        labelSpan.textContent = cleanOptionText(opt);

        btn.appendChild(letterSpan);
        btn.appendChild(labelSpan);
        btn.addEventListener("click", () => answerCurrent(idx));
        optsContainer.appendChild(btn);
      });

      const expPanel = document.getElementById("quiz-explanation");
      expPanel.className = "explanation-panel";
      expPanel.textContent = "";

      document.getElementById("next-btn").classList.remove("visible");
    }

    function answerCurrent(selectedIndex) {
      const s = STATE.session;
      if (s.answered) return;

      const q = s.questions[s.index];
      if (!q || selectedIndex < 0 || selectedIndex >= q.options.length) return;

      s.answered = true;
      const isCorrect = selectedIndex === q.correctIndex;

      document.getElementById("quiz-progress-bar").style.width = `${((s.index + 1) / s.questions.length) * 100}%`;

      const stat = getQStat(q.id);
      stat.timesSeen = (stat.timesSeen || 0) + 1;
      stat.isWrong = !isCorrect;
      saveStats();

      if (isCorrect) {
        s.correct++;
      } else {
        s.mistakes.push({
          question: q,
          selected: selectedIndex,
          correct: q.correctIndex
        });
      }

      const rows = document.querySelectorAll("#quiz-options .option-row");
      rows.forEach((row, idx) => {
        row.disabled = true;
        if (idx === q.correctIndex) {
          row.classList.add("correct");
        } else if (idx === selectedIndex && !isCorrect) {
          row.classList.add("wrong");
        } else {
          row.classList.add("dimmed");
        }
      });

      const expPanel = document.getElementById("quiz-explanation");
      expPanel.textContent = q.explanation;
      expPanel.classList.add("visible");

      document.getElementById("next-btn").classList.add("visible");
    }

    function toggleFlagCurrent() {
      if (STATE.view !== "QUIZ") return;
      const q = STATE.session.questions[STATE.session.index];
      if (!q) return;

      const stat = getQStat(q.id);
      stat.isFlagged = !stat.isFlagged;
      saveStats();
      document.getElementById("btn-quiz-flag").classList.toggle("flagged", Boolean(stat.isFlagged));
    }

    function nextOrFinish() {
      const s = STATE.session;
      if (!s.answered) return;

      if (s.index < s.questions.length - 1) {
        s.index++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        finishSession();
      }
    }

    // ==========================================================================
    // RECAP VIEW
    // ==========================================================================
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function finishSession() {
      const s = STATE.session;
      const total = s.questions.length;
      const pct = total > 0 ? Math.round((s.correct / total) * 100) : 0;
      const durationSec = Math.max(1, Math.round((Date.now() - s.startTime) / 1000));

      STATE.history.push({
        scorePct: pct,
        correct: s.correct,
        total,
        durationSec,
        timestamp: Date.now()
      });
      if (STATE.history.length > 10) {
        STATE.history = STATE.history.slice(-10);
      }
      saveHistory();

      document.getElementById("recap-pct").textContent = `${pct}%`;
      document.getElementById("recap-fraction").textContent = `${s.correct} / ${total}`;
      document.getElementById("recap-time").textContent = formatTime(durationSec);

      updateRecapReviewBadge();
      renderMistakes();
      setView("RECAP");
    }

    function updateRecapReviewBadge() {
      const count = getReviewQuestions().length;
      document.getElementById("review-badge-recap").textContent = count;
      document.getElementById("btn-recap-review").disabled = count === 0;
    }

    function renderMistakes() {
      const container = document.getElementById("recap-mistakes");
      container.innerHTML = "";

      STATE.session.mistakes.forEach((m) => {
        const q = m.question;
        const stat = getQStat(q.id);

        const card = document.createElement("article");
        card.className = "mistake-card";

        const header = document.createElement("div");
        header.className = "mistake-header";

        const title = document.createElement("h3");
        title.className = "mistake-q";
        title.textContent = q.question;

        const flagBtn = document.createElement("button");
        flagBtn.type = "button";
        flagBtn.className = `icon-btn ${stat.isFlagged ? "flagged" : ""}`;
        flagBtn.title = "Da rivedere";
        flagBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
        flagBtn.addEventListener("click", () => {
          stat.isFlagged = !stat.isFlagged;
          saveStats();
          flagBtn.classList.toggle("flagged", stat.isFlagged);
          updateRecapReviewBadge();
        });

        header.appendChild(title);
        header.appendChild(flagBtn);

        const opts = document.createElement("div");
        opts.className = "mistake-options";

        const wrongDiv = document.createElement("div");
        wrongDiv.className = "mistake-opt wrong";
        wrongDiv.textContent = `${LETTERS[m.selected]}) ${cleanOptionText(q.options[m.selected])}`;

        const rightDiv = document.createElement("div");
        rightDiv.className = "mistake-opt correct";
        rightDiv.textContent = `${LETTERS[m.correct]}) ${cleanOptionText(q.options[m.correct])}`;

        opts.appendChild(wrongDiv);
        opts.appendChild(rightDiv);

        const exp = document.createElement("p");
        exp.className = "mistake-exp";
        exp.textContent = q.explanation;

        card.appendChild(header);
        card.appendChild(opts);
        card.appendChild(exp);
        container.appendChild(card);
      });
    }

    // ==========================================================================
    // RESET INLINE A DOPPIO CLICK (SENZA MODALI INVASIVE)
    // ==========================================================================
    function handleResetClick() {
      const btn = document.getElementById("btn-reset");
      const icon = document.getElementById("icon-reset");

      if (!STATE.resetArmed) {
        STATE.resetArmed = true;
        btn.classList.add("confirm-danger");
        icon.innerHTML = `<polyline points="20 6 9 17 4 12"/>`;
        clearTimeout(STATE.resetTimer);
        STATE.resetTimer = setTimeout(disarmReset, 2600);
      } else {
        STATE.stats = {};
        STATE.history = [];
        try {
          localStorage.removeItem(STORAGE_KEYS.STATS);
          localStorage.removeItem(STORAGE_KEYS.HISTORY);
        } catch (e) {}
        disarmReset();
        renderHome();
      }
    }

    function disarmReset() {
      STATE.resetArmed = false;
      clearTimeout(STATE.resetTimer);
      const btn = document.getElementById("btn-reset");
      const icon = document.getElementById("icon-reset");
      if (btn && icon) {
        btn.classList.remove("confirm-danger");
        icon.innerHTML = `<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>`;
      }
    }

    // ==========================================================================
    // NAVIGAZIONE GLOBALE DA TASTIERA (ATTIVA SUBITO ALL'APERTURA DELLA PAGINA)
    // ==========================================================================
    function ensurePageFocus() {
      const active = document.activeElement;
      if (active && active.id === "q-count-input") return;
      try {
        window.focus();
        if (document.body && document.activeElement !== document.body) {
          document.body.focus({ preventScroll: true });
        }
      } catch (e) {}
    }

    function handleKeydown(e) {
      const active = document.activeElement;
      if (active && active.id === "q-count-input") {
        if (e.key === "Enter") {
          active.blur();
          ensurePageFocus();
        }
        return;
      }

      if (e.ctrlKey || e.altKey || e.metaKey) return;

      const isSpace = e.code === "Space" || e.key === " " || e.key === "Spacebar";
      const isR = e.key === "r" || e.key === "R";

      if (isSpace) {
        e.preventDefault();
      }

      if (STATE.view === "HOME") {
        if (isSpace) {
          startStandardSession();
        } else if (isR && getReviewQuestions().length > 0) {
          e.preventDefault();
          startReviewSession();
        }
        return;
      }

      if (STATE.view === "QUIZ") {
        if (["1", "2", "3", "4", "5"].includes(e.key) && !STATE.session.answered) {
          e.preventDefault();
          answerCurrent(parseInt(e.key, 10) - 1);
        } else if (isR) {
          e.preventDefault();
          toggleFlagCurrent();
        } else if (isSpace && STATE.session.answered) {
          nextOrFinish();
        }
        return;
      }

      if (STATE.view === "RECAP") {
        if (isSpace) {
          setView("HOME");
        } else if (isR && getReviewQuestions().length > 0) {
          e.preventDefault();
          startReviewSession();
        }
      }
    }

    // ==========================================================================
    // INIT
    // ==========================================================================
    function init() {
      loadState();
      applyTheme(STATE.theme);
      renderHome();

      document.getElementById("btn-theme").addEventListener("click", (e) => {
        applyTheme(STATE.theme === "dark" ? "light" : "dark");
        e.currentTarget.blur();
        ensurePageFocus();
      });

      document.getElementById("btn-reset").addEventListener("click", (e) => {
        handleResetClick();
        e.currentTarget.blur();
        ensurePageFocus();
      });

      const countInput = document.getElementById("q-count-input");
      document.getElementById("btn-step-minus").addEventListener("click", (e) => {
        const next = Math.max(1, getRequestedCount() - 5);
        countInput.value = next;
        try { localStorage.setItem(STORAGE_KEYS.COUNT, String(next)); } catch (err) {}
        e.currentTarget.blur();
        ensurePageFocus();
      });

      document.getElementById("btn-step-plus").addEventListener("click", (e) => {
        const next = getRequestedCount() + 5;
        countInput.value = next;
        try { localStorage.setItem(STORAGE_KEYS.COUNT, String(next)); } catch (err) {}
        e.currentTarget.blur();
        ensurePageFocus();
      });

      countInput.addEventListener("change", () => {
        const val = getRequestedCount();
        countInput.value = val;
        try { localStorage.setItem(STORAGE_KEYS.COUNT, String(val)); } catch (err) {}
      });

      document.getElementById("btn-start-quiz").addEventListener("click", startStandardSession);
      document.getElementById("btn-start-review").addEventListener("click", startReviewSession);

      document.getElementById("btn-quiz-close").addEventListener("click", () => setView("HOME"));
      document.getElementById("btn-quiz-flag").addEventListener("click", (e) => {
        toggleFlagCurrent();
        e.currentTarget.blur();
        ensurePageFocus();
      });
      document.getElementById("next-btn").addEventListener("click", nextOrFinish);

      document.getElementById("btn-recap-home").addEventListener("click", () => setView("HOME"));
      document.getElementById("btn-recap-review").addEventListener("click", startReviewSession);

      window.addEventListener("keydown", handleKeydown, { capture: true });
      window.addEventListener("resize", () => {
        if (STATE.view === "HOME") renderChart();
      });
      window.addEventListener("load", () => {
        ensurePageFocus();
        setTimeout(ensurePageFocus, 50);
      });
      document.addEventListener("click", (e) => {
        if (e.target && e.target.id !== "q-count-input") {
          ensurePageFocus();
        }
      });
      ensurePageFocus();
      requestAnimationFrame(ensurePageFocus);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
